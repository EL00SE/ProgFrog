# Local infrastructure only (Postgres + a DB UI).
# Run the app itself with `pnpm dev`.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: progfrog
      POSTGRES_PASSWORD: progfrog
      POSTGRES_DB: progfrog
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U progfrog -d progfrog"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:5
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
